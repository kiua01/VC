name: VC Build
on:
  push:
    paths:
      - 'VC-*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - name: Unzip the newest VC zip and run it
        run: |
          ls VC-*.zip >/dev/null 2>&1 || { echo "::error::Upload a VC-*.zip first"; exit 1; }
          ZIP="$(ls VC-*.zip | sort -V | tail -n 1)"
          echo "Using $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          cd work
          bash ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VC-output
          path: work/out/
